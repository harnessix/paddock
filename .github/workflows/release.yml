name: Release

# Builds the paddock binaries for a version tag: x86_64 and aarch64 Linux,
# aarch64 and x86_64 macOS. It also packs the source, fills in the Homebrew
# formula and builds the VM guest files (vm-assets.yml). When every build is
# done and the CI checks (ci.yml) passed on the same commit, one job attests
# the provenance of every file and attaches them to the GitHub Release of
# that tag. It never replaces a file that is already there with another one
# (.github/scripts/release-upload.sh). The release notes come from the
# matching section of CHANGELOG.md. Run it by hand to add the files to an
# existing tag. That works only for a tag that has .github/actions/rust and
# rust-toolchain.toml (the tags after v0.2.1): the jobs check out the tag and use
# that action, so for an older tag every build job fails at
# `uses: ./.github/actions/rust`.
#
# Every action from outside this repository is pinned by its full commit
# hash: a tag or branch can move, and the attestation proves which workflow
# ran, not which action code ran.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true

permissions:
  contents: read

defaults:
  run:
    # With an explicit bash, a step also fails when a command in a pipe fails.
    shell: bash

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # paddock update and paddock doctor read the releases of this repository.
  PADDOCK_RELEASE_REPO: ${{ github.repository }}
  # build.rs makes a release build, which prints only the version. It stops
  # when the checkout is not a clean checkout of the tag of that version.
  PADDOCK_RELEASE_BUILD: "1"

jobs:
  commit:
    name: commit of the tag
    # Every job checks out this commit, so a tag that moves during the run
    # cannot mix two commits in one release.
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - id: sha
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::$TAG is not a tag"; exit 1; }
          echo "sha=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    # The same checks as for a pull request. A failure stops the release.
    needs: commit
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.commit.outputs.sha }}

  build:
    name: build (${{ matrix.arch }}-${{ matrix.os }})
    # Each target builds on a native GitHub runner. An older Ubuntu links
    # against an older glibc, so the Linux binary also runs on distributions
    # with a newer one. On macOS, build.rs builds the pty library only for
    # the system it runs on, so x86_64 needs an Intel runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: linux
            runner: ubuntu-22.04
          - arch: aarch64
            os: linux
            runner: ubuntu-22.04-arm
          - arch: aarch64
            os: macos
            runner: macos-15
          - arch: x86_64
            os: macos
            runner: macos-15-intel
    needs: commit
    runs-on: ${{ matrix.runner }}
    steps:
      # By the tag, not the commit: build.rs needs the tag to see a release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Check the commit
        env:
          SHA: ${{ needs.commit.outputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::$TAG moved during the run"; exit 1; }
      - uses: ./.github/actions/rust
      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$TAG" ] || { echo "::error::Cargo.toml has $version, the tag is $TAG"; exit 1; }
      - name: Build
        run: cargo build --release --locked 2>&1 | tee build.log
      - name: Check the build kind
        run: |
          out=$(target/release/paddock --version)
          [ "$out" = "paddock ${TAG#v}" ] || { echo "::error::paddock --version prints '$out', not 'paddock ${TAG#v}'"; exit 1; }
      # Without the pty library, Seatbelt terminal runs get no pty.
      - name: Check the pty library
        if: matrix.os == 'macos'
        run: |
          if grep -q 'cannot build src/ptyshim/shim.c' build.log; then
            echo "::error::build.rs could not build the pty library"
            exit 1
          fi
      # paddock-vm owns the VM of the VM backend. It needs an ad hoc
      # signature with only the virtualization entitlement.
      - name: Sign paddock-vm
        if: matrix.os == 'macos'
        run: |
          codesign --force --sign - --entitlements packaging/macos/paddock-vm.entitlements target/release/paddock-vm
          codesign -d --entitlements - target/release/paddock-vm 2>&1 | tee entitlements.txt
          grep -q com.apple.security.virtualization entitlements.txt || { echo "::error::paddock-vm has no virtualization entitlement"; exit 1; }
      - name: Package
        run: |
          name="paddock-${TAG#v}-${{ matrix.arch }}-${{ matrix.os }}"
          mkdir -p "dist/$name"
          cp target/release/paddock README.md LICENSE CHANGELOG.md "dist/$name/"
          if [ "${{ matrix.os }}" = macos ]; then cp target/release/paddock-vm "dist/$name/"; fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # macOS has shasum but no sha256sum. Both print the same line.
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd dist && sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.arch }}-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  source:
    name: source and Homebrew formula
    needs: commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - name: Pack the source
        run: |
          version=${TAG#v}
          name="paddock-$version"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      # The formula builds from the source tarball above. This job only
      # attaches it to the release. It does not push it to a tap.
      - name: Fill in the Homebrew formula
        run: |
          version=${TAG#v}
          sha=$(cut -d ' ' -f 1 "dist/paddock-$version.tar.gz.sha256")
          [ "${#sha}" = 64 ] || { echo "::error::no checksum for the source tarball"; exit 1; }
          # The url or sha256 of one guest file in packaging/vm/assets.toml.
          vm() {
            awk -v n="$1" -v k="$2" '/^\[\[file\]\]/ { cur = "" }
              $1 == "name" { gsub(/"/, "", $3); cur = $3 }
              cur == n && $1 == k { gsub(/"/, "", $3); print $3 }' packaging/vm/assets.toml
          }
          sed -e "s|@VERSION@|$version|g" -e "s|@SHA256@|$sha|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
            -e "s|@VM_KERNEL_URL@|$(vm kernel url)|g" -e "s|@VM_KERNEL_SHA256@|$(vm kernel sha256)|g" \
            -e "s|@VM_ROOTFS_URL@|$(vm rootfs.img url)|g" -e "s|@VM_ROOTFS_SHA256@|$(vm rootfs.img sha256)|g" \
            packaging/homebrew/paddock.rb > dist/paddock.rb
          # The guest files must come from the release of this tag.
          for f in kernel rootfs.img; do
            want="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$f"
            [ "$(vm "$f" url)" = "$want" ] || { echo "::error::packaging/vm/assets.toml has no URL $want"; exit 1; }
          done
          if grep -n '@[A-Z0-9_]*@' dist/paddock.rb; then
            echo "::error::the formula has a placeholder that is not filled in"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-source
          path: dist/*
          if-no-files-found: error

  vm:
    name: VM guest files
    # kernel, rootfs.img and assets.toml of packaging/vm/build.sh. The
    # publish job checks them against packaging/vm/assets.toml of the tag.
    needs: commit
    uses: ./.github/workflows/vm-assets.yml
    with:
      ref: ${{ needs.commit.outputs.sha }}

  publish:
    name: publish
    # The CI checks and every build must succeed first. Then one release
    # gets all files.
    needs: [commit, ci, build, source, vm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For the provenance attestations.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vm-assets
          path: vm
      # The paddock binary and the formula pin the guest files with
      # packaging/vm/assets.toml. A release with other files cannot install.
      - name: Check the VM guest files
        run: |
          if ! diff -u packaging/vm/assets.toml vm/assets.toml; then
            echo "::error::packaging/vm/assets.toml of $TAG does not match the built guest files. Run the workflow \"VM guest files\" on the release commit, commit its assets.toml, and tag again."
            exit 1
          fi
      - name: Write the checksum file and the notes
        run: |
          (cd dist && sha256sum ./*.tar.gz | sed 's|  \./|  |' > SHA256SUMS)
          (cd vm && sha256sum kernel rootfs.img) >> dist/SHA256SUMS
          cat dist/SHA256SUMS
          awk -v v="## ${TAG#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section ## ${TAG#v}"; exit 1; }
      # Before the attestation: a signed statement stays public also when
      # the run stops, so none is made for files that are never released.
      - name: Check that the tag did not move
        env:
          SHA: ${{ needs.commit.outputs.sha }}
        run: |
          now=$(git ls-remote origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | sort -k2 | awk 'END { print $1 }')
          [ "$now" = "$SHA" ] || { echo "::error::$TAG points to $now now, the run built $SHA"; exit 1; }
      # A signed statement that this workflow run built each file from the
      # commit of the tag. `gh attestation verify FILE --repo OWNER/NAME`
      # checks it (README.md, Install).
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
            dist/paddock.rb
            vm/kernel
            vm/rootfs.img
            vm/assets.toml
      - name: Publish
        run: |
          .github/scripts/release-upload.sh "$TAG" notes.md \
            dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS dist/paddock.rb vm/kernel vm/rootfs.img vm/assets.toml
