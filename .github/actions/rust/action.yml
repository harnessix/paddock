name: Rust from rust-toolchain.toml
description: >-
  Installs the one Rust version that rust-toolchain.toml names, with
  rustfmt and clippy, and makes it the default. CI, the release and the VM
  guest files use it, so all of them build with the same compiler.
inputs:
  targets:
    description: Extra targets, separated by commas
    required: false
    default: ""
outputs:
  version:
    description: The Rust version
    value: ${{ steps.read.outputs.version }}
runs:
  using: composite
  steps:
    - id: read
      shell: bash
      run: |
        version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
        # A floating channel such as stable would let two runs differ.
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=rust-toolchain.toml::channel must be an exact version such as 1.99.1, not '$version'"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-11-12
      with:
        toolchain: ${{ steps.read.outputs.version }}
        components: rustfmt, clippy
        targets: ${{ inputs.targets }}
    - name: Check the compiler
      shell: bash
      run: |
        rustc --version
        rustc --version | grep -q "^rustc ${{ steps.read.outputs.version }} " || { echo "::error::rustc is not ${{ steps.read.outputs.version }}"; exit 1; }
